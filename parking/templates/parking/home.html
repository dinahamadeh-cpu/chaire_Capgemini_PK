<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parking</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(90%, 620px);
            padding: 3rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(23, 32, 51, 0.12);
            text-align: center;
        }

        a {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            background: #2457c5;
            color: white;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            background: #173f96;
        }
    </style>
</head>
<body>
    <main>
        <h1>Gestion des places de parking</h1>
        <p>Consultez les parkings et leurs places disponibles.</p>
        <a href="{% url 'parking:parking_list' %}">Voir les parkings</a>
        <a href="{% url 'parking:login' %}">Se connecter</a>
        <a href="{% url 'parking:signup' %}">Créer un compte</a>
        <a href="{% url 'parking:agent_login' %}">Espace agent</a>
        <a href="{% url 'admin:index' %}">Administration</a>
    </main>
</body>
</html>
