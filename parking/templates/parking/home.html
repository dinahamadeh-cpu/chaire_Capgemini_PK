<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parking</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            color: #172033;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(90%, 620px);
            padding: 3rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(23, 32, 51, 0.12);
            text-align: center;
        }
        .professional-access {
            position: fixed;
            right: 16px;
            bottom: 14px;

            width: 28px;
            height: 28px;
            padding: 0;
            margin: 0;

            display: grid;
            place-items: center;

            background: transparent;
            color: #94a3b8;
            border-radius: 50%;
            font-size: 14px;
            text-decoration: none;
            opacity: 0.45;
            transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .professional-access:hover,
        .professional-access:focus-visible {
            background: rgba(148, 163, 184, 0.16);
            color: #475569;
            opacity: 1;
        }

        a {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            background: #2457c5;
            color: white;
            text-decoration: none;
        }

       button {
            margin: 0.5rem;
            padding: 0.8rem 1.2rem;
            border: 0;
            border-radius: 8px;
            background: #2457c5;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        a:hover,
        a:focus-visible,
        button:hover,
        button:focus-visible {
            background: #1a3e9c;
        }
    </style>
</head>
<body>
    <main>
        <h1>Gestion des places de parking</h1>
        <p>Consultez les parkings et leurs places disponibles.</p>
        <a href="{% url 'parking:parking_list' %}">Voir les parkings</a>
        {% if user.is_authenticated %}
            <a href="{% url 'parking:reservation_list' %}">Mes réservations</a>
            <form method="post" action="{% url 'parking:logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Se déconnecter</button>
            </form>
        {% else %}
            <a href="{% url 'parking:login' %}">Se connecter</a>
            <a href="{% url 'parking:signup' %}">Créer un compte</a>
         {% endif %}

    </main>
    <footer>
        <a
            href="{% url 'parking:professional_login' %}"
            class="professional-access"
            aria-label="Accès professionnel"
            title="Accès professionnel"
        >
            🔒
        </a>
    </footer>
</body>
</html>
