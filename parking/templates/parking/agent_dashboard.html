{% extends "parking/base.html" %}
{% block title %}Espace agent - Parking{% endblock %}
{% block content %}
    <h1>Espace agent</h1>
    <p>Connecté en tant que {{ request.user.username }}.</p>
    <nav>
        <a class="button" href="{% url 'parking:agent_plate_check' %}">Vérifier une plaque</a>
        <a class="button" href="{% url 'parking:agent_stats' %}">Occupation en temps réel</a>
        <a class="button" href="{% url 'parking:agent_affluence' %}">Analyse de l'affluence</a>
    </nav>
    <form method="post" action="{% url 'parking:agent_logout' %}">
        {% csrf_token %}
        <button type="submit">Se déconnecter</button>
    </form>
{% endblock %}
